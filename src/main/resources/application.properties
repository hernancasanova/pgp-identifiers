spring.jpa.properties.hibernate.default_schema=HERNAN
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
spring.datasource.url=jdbc:oracle:thin:@//localhost:1522/xe
spring.datasource.username= system
spring.datasource.password=oracle

DB_SCHEMA=hernan
# spring.jpa.properties.hibernate.default_schema=HERNAN
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.datasource.url=jdbc:postgresql://localhost:5432/pgp_bovines
# spring.datasource.username= admin
# spring.datasource.password= password
spring.jpa.show-sql=true
server.servlet.context-path=/api
spring.jpa.properties.hibernate.format_sql=true
server.port=8007
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=128MB
spring.servlet.multipart.enabled=true
spring.application.name=pgp-identifiers

# EUREKA CLIENT
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# EUREKA INSTANCE - FORZAR USO DE IP
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=127.0.0.1
eureka.instance.instance-id=127.0.0.1:${spring.application.name}:${server.port}
eureka.instance.non-secure-port=${server.port}


#Flyway
spring.flyway.enabled=false
spring.flyway.schemas=${DB_SCHEMA}
spring.flyway.default-schema=${DB_SCHEMA}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1